apiVersion: v1
kind: Secret
metadata:
  name: google-calendar-sync-people
  labels:
    app.kubernetes.io/name: google-calendar-sync
type: Opaque
# PLACEHOLDER — replace before real use.
# One <name>.env per board member, mounted read-only at /config/people; each
# carries the Google secret iCal URL + SOGo credentials. Do NOT commit real
# values here: swap this for a SealedSecret (the board app-deployer Role allows
# bitnami.com/sealedsecrets). `example.env` is ignored by the sync loop, so
# shipping only it means "no members yet" and the pod idles.
stringData:
  example.env: |
    GCAL_ICS_URL=""

    SOGO_URL=""
    SOGO_USERNAME=""
    SOGO_PASSWORD=""
