apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: google-calendar-sync-data
  labels:
    app.kubernetes.io/name: google-calendar-sync
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # vdirsyncer status/ cache + filtered .ics only; keep it small.
      storage: 256Mi
